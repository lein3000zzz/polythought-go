# Regenerate with `make mocks`.
all: false
formatter: goimports
force-file-write: true
log-level: warn
template: testify
structname: '{{.Mock}}{{.InterfaceName}}'
filename: 'mock_{{.InterfaceName | snakecase}}.go'
packages:
  github.com/lein3000zzz/the-watchers/pkg/observability/metrics:
    config:
      dir: internal/mocks/metrics
      pkgname: metricsmocks
    interfaces:
      Manager: {}
      Counter: {}
      Gauge: {}
      Histogram: {}
  github.com/lein3000zzz/polythought-go/pkg/clients/polymarket:
    config:
      dir: internal/mocks/polymarket
      pkgname: polymarketmocks
    interfaces:
      GammaClient: {}
      ClobClient: {}
      DataClient: {}
      MarketStreamClient: {}
      ClobAccountClient: {}
  github.com/lein3000zzz/the-watchers/pkg/observability/logging:
    config:
      dir: internal/mocks/logging
      pkgname: loggingmocks
    interfaces:
      Logger: {}
  github.com/lein3000zzz/polythought-go/internal/core/ports:
    config:
      dir: internal/mocks/ports
      pkgname: portsmocks
    interfaces:
      MarketReader: {}
      OrderBookReader: {}
      UserRepository: {}
      SessionRepository: {}
      APITokenRepository: {}
      InviteRepository: {}
      Transactor: {}
      RateLimiter: {}
      PasswordHasher: {}
      WalletRepository: {}
      SecretBox: {}
      WorkflowRepository: {}
      ExecutionRepository: {}
      ExecutionRecorder: {}
      ExecutionNotifier: {}
      CredentialsVerifier: {}
      AccountReader: {}
      WalletDirectory: {}
      PositionReader: {}
      TemplateRepository: {}
      MarketFeed: {}
      EventReader: {}
      TradeReader: {}
      PriceHistoryReader: {}
      WebhookSender: {}
      CredentialRepository: {}
      CredentialReader: {}
  github.com/lein3000zzz/polythought-go/internal/core/services/auth:
    config:
      dir: internal/mocks/auth
      pkgname: authmocks
    interfaces:
      WorkflowStopper: {}
  github.com/lein3000zzz/polythought-go/internal/core/services/library:
    config:
      dir: internal/mocks/library
      pkgname: librarymocks
    interfaces:
      Workflows: {}
  github.com/lein3000zzz/polythought-go/internal/core/services/workflows:
    config:
      dir: internal/mocks/workflows
      pkgname: workflowsmocks
    interfaces:
      Validator: {}
      Executor: {}
      Supervisor: {}
  github.com/lein3000zzz/polythought-go/internal/adapters/httpapi:
    config:
      dir: internal/mocks/httpapi
      pkgname: httpapimocks
    interfaces:
      AuthService: {}
      WalletService: {}
      WorkflowService: {}
      NodeTypes: {}
      EventService: {}
      LibraryService: {}
      SettingsService: {}
      CredentialService: {}
