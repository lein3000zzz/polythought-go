[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "polythought"
dynamic = ["version"]
description = "Polythought from Python: its data and market data as tables, datasets, and serving your models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "httpx>=0.27",
    "typing_extensions>=4.7",
]

[project.optional-dependencies]
# Tables as pandas DataFrames.
pandas = ["pandas>=2.0"]

[tool.hatch.version]
path = "src/polythought/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/polythought"]

[tool.hatch.build.targets.sdist]
include = ["src/polythought", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Generated from the API's spec.
extend-exclude = ["src/polythought/types.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
