# A release (D373, D421): on a version tag v1.2.3, or by hand from a branch. The e2e tests
# first; then both images for linux/amd64 and arm64 on GHCR, with build provenance and an
# SBOM, signed once the repository is public; then a GitHub Release with the commits since
# the last tag. While the repository is private, only the newest few versions are kept.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # How many tagged versions of each image stay on GHCR while the repository is private,
  # to keep under its free storage.
  KEEP_VERSIONS: '3'

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  images:
    name: Image ${{ matrix.image }}
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: polythought-api
            dockerfile: deployments/Dockerfile
            description: The Polythought API server
          - image: polythought-web
            dockerfile: web/Dockerfile
            description: The Polythought app and docs, behind Caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 gives 1.2.3, 1.2 and latest; a pre-release such as v0.1.0-beta.1 only
      # itself. By hand, main gives edge, another branch its name.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # On the index too, where GHCR reads a multi-platform image's description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
      # Each stage that compiles runs on the runner's own platform, cross-building: no
      # emulation for arm64.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Keyless signing writes who signed, this repository and its commit, to Sigstore's
      # public log: only once the repository is public, when anyone can pull and check.
      - if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - if: ${{ !github.event.repository.private }}
        name: Sign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  cleanup:
    name: Keep the newest versions
    needs: images
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: polythought-api,polythought-web
          keep-n-tagged: ${{ env.KEEP_VERSIONS }}
          exclude-tags: latest,edge
          delete-untagged: true
          delete-partial-images: true
          delete-orphaned-images: true

  release:
    name: GitHub Release
    needs: images
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Notes from the commits since the last tag
        env:
          TAG: ${{ github.ref_name }}
          IMAGES: ghcr.io/${{ github.repository_owner }}
        run: |
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## Images"
            echo
            echo "- \`$IMAGES/polythought-api:${TAG#v}\`"
            echo "- \`$IMAGES/polythought-web:${TAG#v}\`"
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "$previous..$TAG"
              echo
              echo "Since [$previous]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$TAG)."
            else
              git log --no-merges --pretty='- %s (%h)' "$TAG"
            fi
          } > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md $pre
