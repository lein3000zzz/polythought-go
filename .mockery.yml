# Regenerate with `make mocks`.
all: false
formatter: goimports
force-file-write: true
log-level: warn
template: testify
structname: '{{.Mock}}{{.InterfaceName}}'
filename: 'mock_{{.InterfaceName | snakecase}}.go'
packages:
  github.com/lein3000zzz/the-watchers/pkg/observability/metrics:
    config:
      dir: internal/mocks/metrics
      pkgname: metricsmocks
    interfaces:
      Manager: {}
      Counter: {}
      Gauge: {}
      Histogram: {}
  github.com/lein3000zzz/polythought-go/pkg/clients/polymarket:
    config:
      dir: internal/mocks/polymarket
      pkgname: polymarketmocks
    interfaces:
      GammaClient: {}
      ClobClient: {}
      DataClient: {}
      MarketStreamClient: {}
  github.com/lein3000zzz/the-watchers/pkg/observability/logging:
    config:
      dir: internal/mocks/logging
      pkgname: loggingmocks
    interfaces:
      Logger: {}
  github.com/lein3000zzz/polythought-go/internal/core/ports:
    config:
      dir: internal/mocks/ports
      pkgname: portsmocks
    interfaces:
      MarketReader: {}
      OrderBookReader: {}
      UserRepository: {}
      SessionRepository: {}
      APITokenRepository: {}
      InviteRepository: {}
      Transactor: {}
      RateLimiter: {}
      PasswordHasher: {}
  github.com/lein3000zzz/polythought-go/internal/adapters/httpapi:
    config:
      dir: internal/mocks/httpapi
      pkgname: httpapimocks
    interfaces:
      AuthService: {}
