# Polythought's config file (D69). Copy this file to configs/polythought.yml, where the
# server looks for it, or name another with --config or POLYTHOUGHT_CONFIG. Every value is
# optional here and shown at its default; an environment variable wins over it.
#
# A setting set here is locked on the Config page, as one set in the environment is: an
# admin changes the others there. Secrets are better kept in the environment.
#
# Generated by `make docs-gen` from the code. Do not edit: change the code and regenerate.

database:

  # A Postgres DSN: postgres://user:pass@host:5432/db?sslmode=disable. Required.
  # Environment: POLYTHOUGHT_DATABASE_URL.
  # url: ""

  # Apply pending database migrations on start.
  # Environment: POLYTHOUGHT_AUTO_MIGRATE.
  # auto_migrate: true

secrets:

  # The master keys for secrets at rest, "id:base64key[,id:base64key]": the first
  # encrypts, the rest only decrypt. Required; better kept in the environment.
  # Make one with: echo "k1:$(openssl rand -base64 32)"
  # Environment: POLYTHOUGHT_SECRET_KEYS.
  # keys: ""

http:

  # The address the server listens on.
  # Environment: POLYTHOUGHT_HTTP_ADDR.
  # addr: ":8080"

  # Where users reach the server: its origin is the only one allowed to make
  # cookie-authenticated changes, and https makes cookies Secure.
  # Environment: POLYTHOUGHT_PUBLIC_URL.
  # public_url: "http://localhost:8080"

  # Address ranges (CIDR, e.g. 10.0.0.0/8) of reverse proxies allowed to report the
  # client's address in X-Forwarded-For. Leave empty without a proxy: anyone could then
  # pick their own address and dodge rate limits.
  # Environment: POLYTHOUGHT_TRUSTED_PROXIES.
  # trusted_proxies: []

admin:

  # With admin.password: the first admin, created on start when there is no admin yet.
  # Environment: POLYTHOUGHT_ADMIN_EMAIL.
  # email: ""

  # The first admin's password, at least 12 characters. Better kept in the environment.
  # Environment: POLYTHOUGHT_ADMIN_PASSWORD.
  # password: ""

auth:

  # Who may create an account: anyone (open), people an admin invited (invite), or only
  # admins, on the Users page (closed). One of open, invite, closed.
  # Environment: POLYTHOUGHT_REGISTRATION.
  # registration: "invite"

  # People who sign up themselves get a link by mail, and can sign in once they open it;
  # an account unverified after 7 days is removed. Needs mail set up, under Mail.
  # Accounts from before, and those admins create, count as verified.
  # Environment: POLYTHOUGHT_AUTH_VERIFY_EMAIL.
  # verify_email: false

  # Forgot password? on the sign-in page mails a link to set a new one, working once for
  # an hour; setting it signs the account out everywhere. Works while mail is set up,
  # under Mail.
  # Environment: POLYTHOUGHT_AUTH_PASSWORD_RESET.
  # password_reset: true

  # A browser session unused this long signs out. Applies to new activity at once.
  # Environment: POLYTHOUGHT_SESSION_IDLE_TTL.
  # session_idle_ttl: "168h"

  # A browser session signs out after this long however active it is. Applies to
  # sessions started from now.
  # Environment: POLYTHOUGHT_SESSION_ABSOLUTE_TTL.
  # session_absolute_ttl: "720h"

  # How long an invite works. Applies to invites created from now.
  # Environment: POLYTHOUGHT_AUTH_INVITE_TTL.
  # invite_ttl: "168h"

  # Admins can type an address on the Invites page, and the invite is mailed, naming
  # them; only that address signs up with it, once, verified. Invites can still be
  # shared as links. Works while mail is set up, under Mail.
  # Environment: POLYTHOUGHT_AUTH_INVITE_EMAIL.
  # invite_email: true

  # While registration is by invite, the sign-up page lets people without one ask for
  # it, with a note. They confirm their address by a mailed link first; admins then
  # approve on the Invites page, which mails an invite there, or deny. Needs mail set
  # up, under Mail.
  # Environment: POLYTHOUGHT_AUTH_REQUESTS.
  # requests: false

  # Mail someone whose request to join an admin denied, saying they may ask again in 30
  # days. Off, a denied request just closes.
  # Environment: POLYTHOUGHT_AUTH_REQUEST_DENIED_MAIL.
  # request_denied_mail: true

  # The fewest characters a new password may have. Existing passwords keep working.
  # Environment: POLYTHOUGHT_AUTH_MIN_PASSWORD_LENGTH.
  # min_password_length: 12

workflows:

  # The most workflows one user may have. Users above it keep theirs but cannot create
  # more.
  # Environment: POLYTHOUGHT_WORKFLOWS_MAX_PER_USER.
  # max_per_user: 100

  # The most workflows one user may have running. Lowering it stops none; it applies
  # when one is turned on.
  # Environment: POLYTHOUGHT_WORKFLOWS_MAX_ACTIVE_PER_USER.
  # max_active_per_user: 20

  # The most nodes a workflow may have. Applies when a workflow is saved.
  # Environment: POLYTHOUGHT_WORKFLOWS_MAX_NODES.
  # max_nodes: 200

  # The shortest interval a schedule or market trigger may use, to spare the APIs
  # workflows call.
  # Environment: POLYTHOUGHT_WORKFLOWS_SCHEDULE_MIN_INTERVAL.
  # schedule_min_interval: "1s"

  # The most outcome tokens one market trigger may watch.
  # Environment: POLYTHOUGHT_WORKFLOWS_FEED_MAX_TOKENS.
  # feed_max_tokens: 100

executions:

  # Finished executions older than this are deleted, at start and then daily.
  # Environment: POLYTHOUGHT_EXECUTION_RETENTION.
  # retention: "720h"

  # The most executions of one user that may wait at once, such as at a Wait node. Past
  # it, a node that would wait fails.
  # Environment: POLYTHOUGHT_EXECUTIONS_MAX_WAITING_PER_USER.
  # max_waiting_per_user: 50

  # How far ahead a wait may end. A node asking to wait longer fails.
  # Environment: POLYTHOUGHT_EXECUTIONS_MAX_WAIT.
  # max_wait: "168h"

code:

  # Code nodes run TypeScript users write: everyone may (everyone), admins and the users
  # switched on for code on the Users page (chosen), or no one, admins included (off).
  # Expressions are not code. A workflow with code nodes whose owner may not write code
  # cannot be saved, and fails at once when it is triggered. One of everyone, chosen,
  # off.
  # Environment: POLYTHOUGHT_CODE_ACCESS.
  # access: "everyone"

  # The most custom nodes one user may define. Users above it keep theirs but cannot
  # make more.
  # Environment: POLYTHOUGHT_CODE_CUSTOM_NODES_PER_USER.
  # custom_nodes_per_user: 50

  # The most memory one run of user code may use. Running out stops the run.
  # Environment: POLYTHOUGHT_CODE_MEMORY.
  # memory: 64

  # How long one run of user code may take, waiting for the data it asks for included.
  # Environment: POLYTHOUGHT_CODE_TIME.
  # time: "5s"

  # The largest result one run of user code may return, measured as JSON.
  # Environment: POLYTHOUGHT_CODE_OUTPUT.
  # output: 1024

  # How many times one run of user code, or of a plugin's node, may ask Polythought for
  # data or anything else, such as a market search or a fetch. A plugin's trigger may
  # ask as often each minute.
  # Environment: POLYTHOUGHT_CODE_HOST_CALLS.
  # host_calls: 100

  # How many runs of user code may go at the same time; the others wait their turn. 0
  # means one per CPU of the server.
  # Environment: POLYTHOUGHT_CODE_CONCURRENCY.
  # concurrency: 0

  # Whether user code runs in processes of its own, one for each run at once, rather
  # than in the server's: for public instances. A runner reaches nothing but the server,
  # and runs in the sandbox where the server has one, on Linux 6.2 or later. Each takes
  # about 80 MiB, more while it runs. Off, code runs in the server's process, inside its
  # engine and its limits all the same.
  # Environment: POLYTHOUGHT_CODE_RUNNERS.
  # runners: false

plugins:

  # Where installed plugins are kept: a directory the server may write, a volume in
  # Docker. What admins decide about them is kept in the database.
  # Environment: POLYTHOUGHT_PLUGINS_DIR.
  # dir: "plugins"

  # minisign public keys whose signatures you trust, one a line: the key's line from its
  # .pub file, after a name and a space if you like, such as "Polythought RWQf6LRC…".
  # A plugin they signed shows who did; any other installs only after a warning.
  # Environment: POLYTHOUGHT_PLUGINS_TRUSTED_KEYS.
  # trusted_keys: []

  # The largest plugin archive an admin may install, uploaded or fetched.
  # Environment: POLYTHOUGHT_PLUGINS_MAX_ARCHIVE.
  # max_archive: 100

  # How long a plugin's request to another site may take, from connecting to its
  # answer's last byte.
  # Environment: POLYTHOUGHT_PLUGINS_FETCH_TIME.
  # fetch_time: "10s"

  # The largest body a plugin's request to another site may send, and its answer bring
  # back.
  # Environment: POLYTHOUGHT_PLUGINS_FETCH_BODY.
  # fetch_body: 1024

  # How much one plugin node may keep in its store, its keys and values, in each
  # workflow. Writes past it are refused; what is kept already stays.
  # Environment: POLYTHOUGHT_PLUGINS_STORE_SIZE.
  # store_size: 1024

  # Whether plugins start without the sandbox where the server has none: not on Linux,
  # or on a kernel older than 6.2. Unsandboxed, a plugin reaches whatever the server
  # can, its files, its network and its other processes, so allow it only for plugins
  # you would run yourself. Off, they do not start there. Where the server has a
  # sandbox, plugins always run in it. From each plugin's next start.
  # Environment: POLYTHOUGHT_PLUGINS_UNSANDBOXED.
  # unsandboxed: false

  # How much disk one plugin may take, its own directory and its temporary one together.
  # Past it, the plugin is stopped as crashed and the admins told. Its card on the
  # Plugins page may set its own.
  # Environment: POLYTHOUGHT_PLUGINS_DATA_CAP.
  # data_cap: 1024

  # How much memory one plugin's process may take. Past it, the process is killed, which
  # counts as a crash, and started again; a plugin written in Go also gets a soft limit
  # a little under it, from its next start. Watched on Linux. Its card on the Plugins
  # page may set its own.
  # Environment: POLYTHOUGHT_PLUGINS_MEMORY_CAP.
  # memory_cap: 256

trading:

  # What a workflow's paper account starts with, in dollars: its paper buys spend it and
  # its sells add to it. Accounts already open keep theirs.
  # Environment: POLYTHOUGHT_TRADING_PAPER_BALANCE.
  # paper_balance: 1000

  # Whether workflows may trade live: real orders on Polymarket from their owner's
  # wallet, spending its pUSD. Off, every workflow trades on paper and live orders are
  # refused. On, an owner switches a workflow to live in its Trading view, confirming
  # it. Turning it off cancels every live order resting on the book, every user's;
  # workflows switched to live stay so, but place no orders until it is on again.
  # Environment: POLYTHOUGHT_TRADING_LIVE.
  # live: false

  # The most one live buy may spend, in whole dollars, for every user: one over it is
  # refused before it is sent. 0 for no cap. An admin can give a user a cap of their own
  # on the Users page.
  # Environment: POLYTHOUGHT_TRADING_MAX_LIVE_ORDER.
  # max_live_order: 100

  # The most a user's live buys may spend and hold in 24 hours, in whole dollars, all
  # their workflows together: what they spent, and what their resting buys may still
  # spend. A buy that would go over is refused before it is sent. 0 for no cap. An admin
  # can give a user a cap of their own on the Users page.
  # Environment: POLYTHOUGHT_TRADING_MAX_LIVE_DAY.
  # max_live_day: 1000

  # Your Polymarket builder code, 0x and 64 hex digits, from
  # polymarket.com/settings?tab=builder: live orders then carry it, crediting your
  # builder account with their volume, and pay the builder fee you set there on top of
  # Polymarket's. Empty, orders carry none and pay no builder fee.
  # Environment: POLYTHOUGHT_TRADING_BUILDER_CODE.
  # builder_code: ""

  # Whether users may import a wallet's private key, so it can trade: on, off, or auto,
  # on unless anyone may sign up (Registration open). The server keeps imported keys
  # encrypted, and could trade with them. Keys imported before stay when it is switched
  # off; new ones are refused. One of auto, on, off.
  # Environment: POLYTHOUGHT_TRADING_KEY_IMPORT.
  # key_import: "auto"

  # Your Polymarket Builder API key, with its secret and passphrase below, from
  # polymarket.com/settings?tab=builder. Users of Deposit Wallets can authorise session
  # keys once all three are in: trade-only keys that need no private key here.
  # Polymarket must enable the key for session keys first (builder@polymarket.com).
  # Environment: POLYTHOUGHT_TRADING_BUILDER_API_KEY.
  # builder_api_key: ""

  # The secret of the Builder API key, base64.
  # Environment: POLYTHOUGHT_TRADING_BUILDER_SECRET.
  # builder_secret: ""

  # The passphrase of the Builder API key.
  # Environment: POLYTHOUGHT_TRADING_BUILDER_PASSPHRASE.
  # builder_passphrase: ""

  # The Polygon JSON-RPC endpoint the server reads approvals from before it grants any,
  # and estimates proxy wallets' gas with: https://polygon.drpc.org, the one
  # Polymarket's client uses, unless you set another, such as your own node or a
  # provider's URL. Kept secret, as such URLs often hold a key.
  # Environment: POLYTHOUGHT_TRADING_POLYGON_RPC.
  # polygon_rpc: "https://polygon.drpc.org"

agents:

  # The most a user's AI agent nodes may spend in a calendar month, UTC, in dollars to
  # the cent, all their workflows together: counted as providers report what they
  # charged, which OpenRouter does and the others do not, so their calls count against
  # the token caps only. Polythought keeps no prices. Once reached, the next call is
  # refused. 0 for no cap. An admin can give a user caps of their own on the Users page.
  # Environment: POLYTHOUGHT_AGENTS_MAX_DOLLARS_MONTH.
  # max_dollars_month: "20.00"

  # The most input tokens a user's AI agent nodes may take in a calendar month, UTC, all
  # their workflows together: what they read, prompts and tool results. A call that
  # could go over is refused before it is made. 0 for no cap.
  # Environment: POLYTHOUGHT_AGENTS_MAX_INPUT_MONTH.
  # max_input_month: 0

  # The most output tokens a user's AI agent nodes may take in a calendar month, UTC:
  # what the models write, thinking included. A call that could go over, its Max tokens
  # with it, is refused before it is made. 0 for no cap.
  # Environment: POLYTHOUGHT_AGENTS_MAX_OUTPUT_MONTH.
  # max_output_month: 0

  # The most tokens a user's AI agent nodes may take in a calendar month, UTC, input and
  # output together. A call that could go over is refused before it is made. 0 for no
  # cap.
  # Environment: POLYTHOUGHT_AGENTS_MAX_TOTAL_MONTH.
  # max_total_month: 20000000

webhook:

  # Let workflows reach addresses inside the server's network, such as a service on the
  # same machine: webhooks, and language models served there through an
  # OpenAI-compatible key, in plain http too (never to a public address). Leave off on a
  # shared instance.
  # Environment: POLYTHOUGHT_WEBHOOK_ALLOW_PRIVATE.
  # allow_private: false

github:

  # Ask GitHub about once an hour how many stars Polythought's repository has, to show
  # beside its link in the app and the docs. Off, the server never calls GitHub, and the
  # link shows no count.
  # Environment: POLYTHOUGHT_GITHUB_STARS.
  # stars: true

log:

  # The least severe messages the server logs. One of debug, info, warn, error.
  # Environment: POLYTHOUGHT_LOG_LEVEL.
  # level: "info"

  # Plain text for people, JSON for log collectors. One of text, json.
  # Environment: POLYTHOUGHT_LOG_FORMAT.
  # format: "text"

telegram:

  # Run the instance's Telegram bot, so members can link Telegram from Settings. Changes
  # restart the bot, not the server.
  # Environment: POLYTHOUGHT_TELEGRAM_ENABLED.
  # enabled: false

  # The token @BotFather gave you when you made the bot, like 123456:ABC-DEF…
  # Environment: POLYTHOUGHT_TELEGRAM_TOKEN.
  # token: ""

  # polling asks Telegram for new messages, and works anywhere, even behind a firewall.
  # webhook has Telegram send them to this server, and needs the public URL to be https.
  # One of polling, webhook.
  # Environment: POLYTHOUGHT_TELEGRAM_MODE.
  # mode: "polling"

mail:

  # The SMTP server Polythought sends mail through, like mail.example.com, with no port:
  # that is below. Mail is set up once this and the From address are in.
  # Environment: POLYTHOUGHT_MAIL_HOST.
  # host: ""

  # 587 for STARTTLS, 465 for TLS from the start, 25 for a plain connection.
  # Environment: POLYTHOUGHT_MAIL_PORT.
  # port: 587

  # starttls upgrades the connection to TLS, tls uses TLS from the start, none stays
  # plain, for a server on the same host or network. The server's certificate is always
  # checked; a password is never sent over a plain connection, except to this host. One
  # of starttls, tls, none.
  # Environment: POLYTHOUGHT_MAIL_SECURITY.
  # security: "starttls"

  # The account Polythought signs in to the mail server with. Leave empty for a server
  # that takes mail without signing in.
  # Environment: POLYTHOUGHT_MAIL_USERNAME.
  # username: ""

  # The password of that account.
  # Environment: POLYTHOUGHT_MAIL_PASSWORD.
  # password: ""

  # The address Polythought's mail comes from, like polythought@example.com. Your mail
  # server must let the account send as it.
  # Environment: POLYTHOUGHT_MAIL_FROM_ADDRESS.
  # from_address: ""

  # The name mail comes from, shown beside the address.
  # Environment: POLYTHOUGHT_MAIL_FROM_NAME.
  # from_name: "Polythought"

  # Users may get their notifications by email too: each chooses per kind in Settings,
  # by email off until they turn it on. Works while mail is set up.
  # Environment: POLYTHOUGHT_MAIL_NOTIFICATIONS.
  # notifications: false
