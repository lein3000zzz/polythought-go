# The browser and agent tests against a throwaway stack in Docker (D374): by hand, and
# before a release, until the repository is public; then on main too.
name: e2e

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Its newest release, not the runner's cached one: the docs' Astro wants a recent one.
          check-latest: true
      # pnpm as web/package.json pins it, docs/package.json alike: Node no longer brings
      # corepack (D423).
      - name: pnpm
        run: npm install --global "pnpm@$(node -p "require('./web/package.json').packageManager.replace(/^pnpm@/, '')")"
      - run: make web-install
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        working-directory: web
      - name: The stack, the agent's tests, then the browser's
        run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore
