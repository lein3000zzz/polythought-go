# The images built from this checkout rather than pulled, for development: make up and
# make e2e add this file.
services:
  api:
    image: polythought-api:dev
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      # dev, as no release stamped it, and the commit make passes (D425)
      args:
        COMMIT: ${POLYTHOUGHT_COMMIT:-}

  web:
    image: polythought-web:dev
    build:
      context: ..
      dockerfile: web/Dockerfile
