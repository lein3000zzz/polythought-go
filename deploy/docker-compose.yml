# Local Postgres for development: `make db-up`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: polythought
      POSTGRES_PASSWORD: polythought
      POSTGRES_DB: polythought
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polythought"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
