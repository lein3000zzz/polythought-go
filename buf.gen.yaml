# Generated locally, the plugins run with go run: nothing goes to a remote service. The
# contract lands in pkg/plugin/v1, beside the SDK in pkg/plugin.
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: pkg
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: pkg
    opt: paths=source_relative
