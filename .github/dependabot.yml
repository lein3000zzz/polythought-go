# Updates once a month (D421), each ecosystem's in one pull request, which runs the checks.
version: 2

updates:
  - package-ecosystem: gomod
    directories: ['/', '/examples/plugins/movers']
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: npm # pnpm's lockfiles
    directories: ['/web', '/docs']
    schedule:
      interval: monthly
    groups:
      javascript:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/deployments', '/web']
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: '/deployments'
    schedule:
      interval: monthly
    groups:
      compose:
        patterns: ['*']
