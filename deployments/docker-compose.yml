# Local Postgres for development: `make db-up`.
# The whole app runs in containers with its profile, at http://localhost:3000: `make up`,
# which reads the settings below from the .env file at the repository root and builds the
# images from this checkout (docker-compose.build.yml). Run alone, with
# `docker compose --profile app up`, it pulls the released images instead (D373), the
# version POLYTHOUGHT_VERSION names, latest unless set. With the updater profile too, an
# admin updates them from the Config page (D425). On a server, .env sets the rest (D427):
# its address, HTTPS, the database's password.
#
# The project, which names the containers and volumes. A stack started before it had this
# name, as deployments after this file's folder, keeps its data by setting
# COMPOSE_PROJECT_NAME to that in .env.
name: polythought

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: polythought
      # Set in .env before the first start: the database keeps the one it began with. Hex,
      # such as from openssl rand -hex 24, as it goes in the API's URL below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polythought}
      POSTGRES_DB: polythought
    # On this machine only, for make run (R21).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polythought"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Not published: clients reach it through web at /api, API tokens included.
  api:
    profiles: [app]
    image: ghcr.io/lein3000zzz/polythought-api:${POLYTHOUGHT_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLYTHOUGHT_DATABASE_URL: postgres://polythought:${POSTGRES_PASSWORD:-polythought}@postgres:5432/polythought?sslmode=disable
      POLYTHOUGHT_SECRET_KEYS: ${POLYTHOUGHT_SECRET_KEYS:-} # required, see internal/config
      # Where people reach this stack, such as https://polythought.example.com: web's
      # published port below unless set. make up keeps that, whatever .env says for make run.
      POLYTHOUGHT_PUBLIC_URL: ${POLYTHOUGHT_PUBLIC_URL:-http://localhost:3000}
      # Only web can reach the API, from the compose network, so its X-Forwarded-For is
      # trusted for client IPs.
      POLYTHOUGHT_TRUSTED_PROXIES: ${POLYTHOUGHT_TRUSTED_PROXIES:-172.16.0.0/12}
      POLYTHOUGHT_ADMIN_EMAIL: ${POLYTHOUGHT_ADMIN_EMAIL:-}
      POLYTHOUGHT_ADMIN_PASSWORD: ${POLYTHOUGHT_ADMIN_PASSWORD:-}
      # Settings an admin can also change on the Config page. Empty leaves them to it; a
      # value set in .env wins and locks the setting there.
      POLYTHOUGHT_REGISTRATION: ${POLYTHOUGHT_REGISTRATION:-}
      POLYTHOUGHT_LOG_LEVEL: ${POLYTHOUGHT_LOG_LEVEL:-}
      POLYTHOUGHT_LOG_FORMAT: ${POLYTHOUGHT_LOG_FORMAT:-}
      POLYTHOUGHT_WEBHOOK_ALLOW_PRIVATE: ${POLYTHOUGHT_WEBHOOK_ALLOW_PRIVATE:-}
      # The updater's token, the same for both (D425): empty, there is no updater.
      POLYTHOUGHT_UPDATER_TOKEN: ${POLYTHOUGHT_UPDATER_TOKEN:-}
    # The plugins admins install (D315); what they decided about them is in Postgres.
    volumes:
      - plugins:/var/lib/polythought/plugins
    restart: unless-stopped

  web:
    profiles: [app]
    image: ghcr.io/lein3000zzz/polythought-web:${POLYTHOUGHT_VERSION:-latest} # the app and the docs
    depends_on:
      - api
    environment:
      # A domain, for Caddy to get and renew its certificate itself: then publish 80 and
      # 443 below. Unset, plain HTTP, for a proxy or a tunnel to put TLS in front.
      POLYTHOUGHT_DOMAIN: ${POLYTHOUGHT_DOMAIN:-:80}
      # Proxies in front of web whose X-Forwarded-For it keeps, ranges separated by spaces,
      # such as a tunnel's; none unless set.
      POLYTHOUGHT_WEB_TRUSTED_PROXIES: ${POLYTHOUGHT_WEB_TRUSTED_PROXIES:-}
    ports:
      - "${POLYTHOUGHT_HTTP_PORT:-3000}:80"
      - "${POLYTHOUGHT_HTTPS_PORT:-3443}:443"
      - "${POLYTHOUGHT_HTTPS_PORT:-3443}:443/udp" # HTTP/3
    # Caddy's certificates, kept across updates.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # Updates the services to a release when an admin asks on the Config page (D425), with
  # --profile updater and POLYTHOUGHT_UPDATER_TOKEN in .env. Not published: the API asks it
  # at http://updater:8080. It holds the Docker socket, which is root on this machine: leave
  # the profile off to update by hand.
  updater:
    profiles: [updater]
    image: ghcr.io/lein3000zzz/polythought-updater:${POLYTHOUGHT_VERSION:-latest}
    environment:
      POLYTHOUGHT_UPDATER_TOKEN: ${POLYTHOUGHT_UPDATER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  pgdata:
  plugins:
  caddy-data:
  caddy-config:
